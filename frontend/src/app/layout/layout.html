<header class="topo">
  <span class="marca">{{ nomeSistema }}</span>
  <div class="acoes">
    <span>{{ auth.usuario()?.nome }} · {{ auth.usuario()?.perfil }}</span
    ><button class="botao secundario" type="button" (click)="auth.logout()">Sair</button>
  </div>
</header>

<div class="corpo">
  <nav class="menu" aria-label="Menu principal">
    <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
      Início
    </a>
    <a routerLink="/matriculas" routerLinkActive="ativo">Matrículas </a>
    <a routerLink="/alunos" routerLinkActive="ativo">Alunos</a>
    <a routerLink="/planos" routerLinkActive="ativo">Planos</a>
    <a routerLink="/instrutores" routerLinkActive="ativo">Instrutores</a>
    <a routerLink="/modalidades" routerLinkActive="ativo">Modalidades</a>
    @if (auth.admin()) {
      <a routerLink="/relatorios" routerLinkActive="ativo">Relatórios</a
      ><a routerLink="/usuarios/novo" routerLinkActive="ativo">Novo usuário</a>
    }
  </nav>

  <main class="conteudo">
    <router-outlet />
  </main>
</div>
