<div class="cabecalho-pagina">
  <h1>{{ id() ? 'Editar instrutor' : 'Novo instrutor' }}</h1>
</div>

@if (erro()) {
  <p class="alerta erro" role="alert">{{ erro() }}</p>
}

<form class="cartao formulario" [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <div class="campo">
    <label for="nome">Nome *</label>
    <input id="nome" formControlName="nome" [class.invalido]="invalido('nome')" />
    @if (invalido('nome')) {
      <small class="msg-erro">Informe um nome entre 3 e 80 caracteres.</small>
    }
  </div>

  <div class="acoes-form">
    <a class="botao secundario" routerLink="/instrutores">Cancelar</a>
