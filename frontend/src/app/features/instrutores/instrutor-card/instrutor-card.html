<article class="cartao-produto">
  <span class="etiqueta">{{ instrutor().turno }}</span>
  <h2>{{ instrutor().nome }}</h2>
  <p>{{ instrutor().email }}</p>
  <p>{{ instrutor().telefone }}</p>
  <p>CREF: {{ instrutor().cref }}</p>
  <div class="acoes">
    @if (auth.podeEditar()) {
      <a class="botao secundario" [routerLink]="['/instrutores', instrutor()._id, 'editar']">
        Editar
      </a>
    }
    @if (auth.admin()) {
      <button type="button" class="botao perigo" (click)="pedirExclusao()">Excluir</button>
    }
  </div>
</article>
