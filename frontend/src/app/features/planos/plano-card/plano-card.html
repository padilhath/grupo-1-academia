<article class="cartao-produto">
  <span class="etiqueta">{{ plano().duracaoMeses }}</span>
  <h2>{{ plano().nome }}</h2>
  <p class="preco">{{ plano().valorMensal| currency: 'BRL' }}</p>

  <div class="acoes">
    <a class="botao secundario" [routerLink]="['/planos', plano()._id, 'editar']">Editar</a>
    <button type="button" class="botao perigo" (click)="pedirExclusao()">Excluir</button>
  </div>
</article>
