<article class="cartao-produto">
  <span class="etiqueta">{{ matricula().status }}</span>
  <h2>{{ textoDe(matricula().aluno) }}</h2>
  <p>{{ textoDe(matricula().plano) }}</p>

  <div class="acoes">
    @if (auth.podeEditar()) {
      <a class="botao secundario" [routerLink]="['/matriculas', matricula()._id, 'editar']"
        >Editar</a
      >
    }
    @if (matricula().status !== 'cancelada') {
      @if (auth.podeEditar()) {
        <button type="button" class="botao perigo" (click)="pedirExclusao()">
          Cancelar matrícula
        </button>
      }
    }
  </div>
</article>
